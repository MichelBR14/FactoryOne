specVersion: "4.0"
metadata:
  name: factoreone.app
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        transformModulesToUI5: true
        omitTSFromBuildResult: true
